# SafeCommute AI theme - "night" palette derived from the ui-ux-pro-max design system
# (navy / blue data colours + amber highlight, Fira Sans / Fira Code).
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E2E8F0"
borderColor = "#24314D"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap"

[browser]
gatherUsageStats = false
